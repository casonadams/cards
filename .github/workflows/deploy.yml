name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'
      - name: Install web dependencies
        working-directory: ./web
        run: pnpm install
      - name: Install cccc
        uses: taiki-e/install-action@v2
        with:
          tool: cccc-cli@1.7.0

      - name: Lint web application (oxlint)
        working-directory: ./web
        run: pnpm lint

      - name: Type check web (svelte-check)
        working-directory: ./web
        run: pnpm check

      - name: Check complexity (cccc)
        run: cccc web/src

      - name: Build web application
        working-directory: ./web
        run: pnpm build
        env:
          GITHUB_PAGES: "true"
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
