[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Cason Adams"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
rand = "0.9"
rand_chacha = "0.9"

[workspace.lints.rust]
linker_messages = "allow"

[profile.dev]
opt-level = 0
debug = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.dev.build-override]
opt-level = 3

[profile.test]
opt-level = 0
debug = 1
split-debuginfo = "unpacked"

[profile.test.package."*"]
opt-level = 1
debug = false

[profile.test.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
