[workspace]
resolver = "3"
members = ["crates/cards-core", "crates/cards-net", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.dependencies]
cards-core = { path = "crates/cards-core" }
cards-net = { path = "crates/cards-net" }
serde = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
too_many_lines = "warn"
