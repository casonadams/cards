[package]
name = "cards-app"
description = "The nsh app: lobby, waiting room and card table for Oh Well and Canadian Salad."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Same as the workspace lints, except unsafe_code is "deny" so `entropy.rs` can allow the
# one extern hook nsh's web runtime needs; everything else stays forbidden by review.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
too_many_lines = "warn"

[dependencies]
cards-core.workspace = true
cards-net.workspace = true
nsh-core = "0.6.1"
nsh-base = "0.6.1"
iroh = { version = "1.5", default-features = false, features = ["tls-ring"] }
async-channel = "2"
n0-future = "0.3"
getrandom = "0.4"
serde_json = "1"

[dev-dependencies]
nsh-engine = "0.6.1"
nsh-testing = "0.6.1"
